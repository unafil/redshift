- type: marking
  id: BunnyTail
  bodyPart: Tail
  markingCategory: Tail
  #speciesRestriction: [Human, SlimePerson, IPC] # Redshift - nuke species restriction
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
  sprites:
  - sprite: _EE/Mobs/Customization/kemonomimi-tails.rsi # Redshift - _EE namespace
    state: bunnytail

- type: marking
  id: BunnyTailAnimated
  bodyPart: Tail
