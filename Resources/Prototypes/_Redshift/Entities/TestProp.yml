- type: entity
  parent: BaseMob
  id: ReedProp
  name: Reed-Haj
  description: "...that on the day of my final agony‚ you will be there‚ lying in my sheets‚ O sorrow‚ so that you might once again attempt to enter my heart." 
  components:
  - type: Sprite
    sprite: _Redshift/prop.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: ToggleableVisuals
    spriteLayer: enum.ToggleableVisuals.Layer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: ItemToggle
    predictable: false
#    soundActivate:
#      path: /Audio/Items/flashlight_on.ogg
#    soundDeactivate:
#      path: /Audio/Items/flashlight_off.ogg
